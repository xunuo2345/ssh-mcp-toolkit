name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: test
          PASSWORD_ACCESS: "true"
          USER_PASSWORD: secret
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z localhost 2222 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a stable semver version, optionally prefixed with v: $REF_NAME"
            exit 1
          fi
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - name: Run SSH integration tests
        env:
          SSH_MCP_INTEGRATION_HOST: 127.0.0.1
          SSH_MCP_INTEGRATION_JUMP_HOST: 127.0.0.1
          SSH_MCP_INTEGRATION_PORT: "2222"
          SSH_MCP_INTEGRATION_USER: test
          SSH_MCP_INTEGRATION_PASSWORD: secret
        run: npm run test:integration
      - run: npm run build
      - run: npm publish
