name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a stable semver version, optionally prefixed with v: $REF_NAME"
            exit 1
          fi
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - name: Run SSH integration tests
        run: |
          set +e
          docker compose --profile test run --build --rm test npm run test:integration 2>&1 | tee "$RUNNER_TEMP/ssh-mcp-integration.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 25 "$RUNNER_TEMP/ssh-mcp-integration.log" | tr '\n' ' ')"
            echo "::error title=SSH integration tests failed::$summary"
          fi
          exit "$status"
      - run: npm run build
      - run: npm publish
