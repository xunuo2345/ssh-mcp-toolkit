name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run tests
        env:
          SSH_MCP_DISABLE_MAIN: "1"
        run: npm test
      - name: Run SSH integration tests
        run: docker compose --profile test run --build --rm test npm run test:integration


